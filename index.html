<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="manifest" href="/manifest.json">
  
  <!-- CRITICAL: iOS viewport fix — prevents black screen from viewport height issues -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />

  <!-- iOS Safari web app meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="At Your Age" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Force iOS Safari to use hardware acceleration -->
  <meta name="format-detection" content="telephone=no" />

  <!-- Prevent iOS link preview popups from breaking layout -->
  <meta name="apple-touch-fullscreen" content="yes" />

  <link rel="apple-touch-icon" href="/icons/favicon.png">
  <title>At Your Age — AYA</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-30ZXCBJXSQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-30ZXCBJXSQ');
  </script>

  <!-- Google Translate -->
  <style>
    /* Hide the ugly Google Translate widget */
    .skiptranslate, #google_translate_element, .goog-te-banner-frame {
        display: none !important;
    }
    body {
        top: 0px !important; 
    }
  </style>
</head>

<body>
  <div id="google_translate_element"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,hi', autoDisplay: false}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- 
      Loading screen shown before React mounts.
      Prevents black flash on iOS.
      Hidden by JS once app is ready.
    -->
    <div id="app-loader" style="
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, #281A4B, #1E1338, #1A1033);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 0.4s ease;
      user-select: none;
    ">
      <div style="
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
      ">
        <div style="
          position: absolute;
          inset: 0;
          background: rgba(168, 85, 247, 0.25);
          filter: blur(40px);
          border-radius: 50%;
        "></div>
        <canvas id="mascot-loader-canvas" width="140" height="140" style="
          position: relative;
          z-index: 10;
          width: 100%;
          height: 100%;
          object-fit: contain;
          filter: drop-shadow(0 0 25px rgba(213, 117, 255, 0.5));
        "></canvas>
      </div>
      <p style="
        color: #00f2ff;
        font-size: 0.95rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-top: 1.5rem;
        text-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        animation: mascotPulse 1.5s ease-in-out infinite;
      ">LOADING YOUR UNIVERSE...</p>
    </div>

    <style>
      @keyframes mascotPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.98); }
      }
    </style>

    <div id="root"></div>

    <script>
      (function() {
        var canvas = document.getElementById('mascot-loader-canvas');
        var ctx = canvas ? canvas.getContext('2d') : null;
        var img = new Image();
        img.src = '/assets/mascot_anim_sheet.png';
        var frameIndex = 0;
        var animId = null;
        var lastTime = performance.now();
        var frameInterval = 1000 / 24;

        img.onload = function() {
          function render(now) {
            var elapsed = now - lastTime;
            if (elapsed >= frameInterval) {
              lastTime = now - (elapsed % frameInterval);
              frameIndex = (frameIndex + 1) % 60;
              var col = frameIndex % 10;
              var row = Math.floor(frameIndex / 10);
              if (ctx) {
                ctx.clearRect(0, 0, 140, 140);
                ctx.drawImage(img, col * 140, row * 140, 140, 140, 0, 0, 140, 140);
              }
            }
            animId = requestAnimationFrame(render);
          }
          animId = requestAnimationFrame(render);
        };

        // Hide loader once page is interactive
        window.addEventListener('load', function() {
          setTimeout(function() {
            var loader = document.getElementById('app-loader');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(function() {
                loader.style.display = 'none';
                if (animId) cancelAnimationFrame(animId);
              }, 400);
            }
          }, 300);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
